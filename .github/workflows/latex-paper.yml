name: Build LaTeX Paper

on:
  push:
    paths:
      - "docs/paper/**"
      - ".github/workflows/latex-paper.yml"
  pull_request:
    paths:
      - "docs/paper/**"
      - ".github/workflows/latex-paper.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: docs/paper/whitepaper.tex
          latexmk_use_lualatex: false
          latexmk_use_xelatex: false

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf
          path: docs/paper/whitepaper.pdf
